<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💛Tu t'ennuies? Appuie sur F5 :)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,700;1,700&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Neue', cursive, sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.8s ease-in-out;
    }

    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* 1. Clignotement multicolore */
    @keyframes rainbowBlink {
      0% { color: #ff007f; text-shadow: 0 0 18px #ff007f; }
      20% { color: #00f0ff; text-shadow: 0 0 20px #00f0ff; }
      40% { color: #ffea00; text-shadow: 0 0 22px #ffea00; }
      60% { color: #ff00ea; text-shadow: 0 0 24px #ff00ea; }
      80% { color: #00ff66; text-shadow: 0 0 20px #00ff66; }
      100% { color: #ff007f; text-shadow: 0 0 18px #ff007f; }
    }
    .anim-blink-rainbow {
      animation: rainbowBlink 0.38s steps(2, start) infinite !important;
    }

    /* 2. L'image bouge gentiment */
    @keyframes gentleSway {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-16px) rotate(-6deg); }
      75% { transform: translateY(12px) rotate(6deg); }
    }
    .anim-gentle-sway {
      animation: gentleSway 3s ease-in-out infinite;
    }

    /* 3. L'image grandit et rapetisse */
    @keyframes heartPump {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.24); }
      50% { transform: scale(0.95); }
      75% { transform: scale(1.16); }
    }
    .anim-heart-pump {
      animation: heartPump 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* 4. L'image tourne sur elle-même */
    @keyframes kitschSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .anim-spin-fast {
      animation: kitschSpin 3.5s linear infinite;
    }

    /* 5. Le texte est droit puis se tord comme un cœur en boucle */
    @keyframes textHeartBend {
      0%, 100% {
        transform: perspective(300px) scale(1) rotate(0deg) skewX(0deg);
        filter: drop-shadow(0 2px 8px rgba(255, 20, 147, 0.4));
      }
      25% {
        transform: perspective(300px) scale(1.12) rotate(-5deg) skewX(-14deg) translateY(-8px);
        filter: drop-shadow(0 0 14px #ff1493);
      }
      50% {
        transform: perspective(300px) scale(0.92) rotate(4deg) translateY(6px);
        filter: drop-shadow(0 0 20px #ffe600);
      }
      75% {
        transform: perspective(300px) scale(1.15) rotate(5deg) skewX(14deg) translateY(-6px);
        filter: drop-shadow(0 0 16px #ff69b4);
      }
    }
    .anim-heart-bend {
      display: inline-block;
      animation: textHeartBend 2.2s ease-in-out infinite;
    }

    /* Mode Brick Breaker / DVD rebondissant désolidarisé */
    .bouncing-active {
      position: fixed !important;
      margin: 0 !important;
      z-index: 30 !important;
      will-change: transform, left, top;
      max-width: 85vw !important;
      pointer-events: none;
    }
  </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen cursor-pointer relative" id="bodyRoot">
  <canvas id="bgCanvas"></canvas>

  <main id="mainContainer" class="relative z-10 flex flex-col items-center justify-center max-w-xl w-full text-center px-4 pointer-events-none transition-transform duration-200">
    <!-- Image ou dessin procédural -->
    <div id="imageWrapper" class="w-full flex items-center justify-center min-h-[220px] sm:min-h-[280px] mb-6">
      <div id="imageStage" class="transition-all duration-300 flex items-center justify-center"></div>
    </div>

    <!-- Message tiré au sort -->
    <div id="textWrapper" class="w-full px-4 py-2">
      <h1 id="messageStage" class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-white leading-tight drop-shadow-[0_4px_12px_rgba(219,39,119,0.9)]">
        bisous marie
      </h1>
    </div>
  </main>

  <script>
    const MESSAGES = [
      "Bisous Eléonore",
      "T'es ma chanteuse préférée!!!!!",
      "Bisouuuuuuus Eléonore!! 🥰",
      "T'es la meilleure!!!! 🔊🦾",
      "Gros calin à distance 🥰",
      "Je pense fort à touaa",
      "Quand est ce que tu me chantes encore une chanson ?🥰🥰",
      "Pleins de bious Eléonore (chastes bien sur) eheh",
      "tu peux y arriver! Je crois en toi😏🥰",
      "Tu me manques peut-être 😏😏",
      "On s'appelle ce soir???",
      "Tu préfères date aquarelle ou date écriture de chanson?",
      "Tu préfères un gros calin de ma part ou aller en cours de business management bulshitting economy",
      "Partages pas le site stp j'ai mis des images sans demander les droits d'auteur 👮👮🏿🚔",
      "Oublie pas de m'envoyer du chaocolat par la poste! (s'te plait 😸)" 
    ];

    const IMAGES = [
      { id: 'coeur_rouge_turtle', type: 'turtle_red' },
      { id: 'coeur_jaune_turtle', type: 'turtle_yellow' },
      { id: 'pleins_de_coeur_turtle', type: 'turtle_multi_red' },
      { id: 'pleins_de_coeur_toutes_les_couleurs_turtle', type: 'turtle_rainbow' },
      { id: 'bonhomme_de_neige', type: 'file_or_fallback', src: 'images/bonhomme_de_neige.jpg', fallback: 'snowman' },
      { id: 'reine_des_neiges_chante', type: 'file_or_fallback', src: 'images/reine_des_neiges_chante.jpg', fallback: 'elsa_singing' },
      { id: 'poeme', type: 'file_or_fallback', src: 'images/Poem for the bench.jpg', fallback: 'elsa_singing' }
    ];

    const ANIMATIONS = [
      { id: 'rainbow_blink', type: 'css', target: 'text', className: 'anim-blink-rainbow' },
      { id: 'gentle_sway', type: 'css', target: 'image', className: 'anim-gentle-sway' },
      { id: 'heart_pump', type: 'css', target: 'image', className: 'anim-heart-pump' },
      { id: 'spin_image', type: 'css', target: 'image', className: 'anim-spin-fast' },
      { id: 'heart_bend', type: 'css', target: 'text', className: 'anim-heart-bend' },
      { id: 'brick_breaker', type: 'bounce', target: 'solo_random' }
    ];

    // Nuances kitsch variées
    const BACKGROUNDS = [
      'radial-gradient(circle at center, #ffd1dc 0%, #ff8fab 50%, #c77dff 100%)',
      'linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%)',
      'linear-gradient(to top, #a18cd1 0%, #fbc2eb 100%)',
      'linear-gradient(120deg, #f093fb 0%, #f5576c 100%)',
      'radial-gradient(circle at center, #ffc3a0 0%, #ffafbd 100%)',
      'linear-gradient(to right, #fa709a 0%, #fee140 100%)'
    ];
    const SPECIAL_YELLOW = '#FEF9C3'; // Jaune clair doux (1 chance sur 5)

    function renderTurtleSvg(type) {
      if (type === 'turtle_red' || type === 'turtle_yellow') {
        const fill = type === 'turtle_red' ? '#ff0055' : '#ffd700';
        return `
          <svg viewBox="0 0 200 200" class="w-52 h-52 sm:w-64 sm:h-64 drop-shadow-[0_10px_25px_rgba(255,0,85,0.45)]">
            <defs>
              <radialGradient id="gradTurtle_${type}" cx="35%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                <stop offset="60%" stop-color="${fill}"/>
                <stop offset="100%" stop-color="${type === 'turtle_red' ? '#b3003b' : '#cc9900'}"/>
              </radialGradient>
            </defs>
            <path d="M100,175 C30,120 15,60 55,30 C85,8 100,45 100,45 C100,45 115,8 145,30 C185,60 170,120 100,175 Z"
                  fill="url(#gradTurtle_${type})" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        `;
      }

      if (type === 'turtle_multi_red') {
        return `
          <svg viewBox="0 0 240 220" class="w-56 h-56 sm:w-72 sm:h-72 drop-shadow-[0_10px_25px_rgba(255,0,100,0.5)]">
            <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
              <path transform="translate(40,30) scale(0.45)" d="M100,175 C30,120 15,60 55,30 C85,8 100,45 100,45 C100,45 115,8 145,30 C185,60 170,120 100,175 Z" fill="#ff4d88"/>
              <path transform="translate(100,15) scale(0.6)" d="M100,175 C30,120 15,60 55,30 C85,8 100,45 100,45 C100,45 115,8 145,30 C185,60 170,120 100,175 Z" fill="#ff0055"/>
              <path transform="translate(10,80) scale(0.5)" d="M100,175 C30,120 15,60 55,30 C85,8 100,45 100,45 C100,45 115,8 145,30 C185,60 170,120 100,175 Z" fill="#ff3377"/>
              <path transform="translate(90,90) scale(0.55)" d="M100,175 C30,120 15,60 55,30 C85,8 100,45 100,45 C100,45 115,8 145,30 C185,60 170,120 100,175 Z" fill="#e6005c"/>
              <path transform="translate(55,60) scale(0.78)" d="M100,175 C30,120 15,60 55,30 C85,8 100,45 100,45 C100,45 115,8 145,30 C185,60 170,120 100,175 Z" fill="#ff0044"/>
            </g>
          </svg>
        `;
      }

      if (type === 'turtle_rainbow') {
        const colors = ['#ff0055', '#ff9900', '#ffee00', '#00e676', '#00d4ff', '#b000ff'];
        const coords = [
          {x: 80, y: 15, s: 0.6, c: colors[0]},
          {x: 20, y: 35, s: 0.45, c: colors[1]},
          {x: 140, y: 35, s: 0.48, c: colors[2]},
          {x: 10, y: 90, s: 0.52, c: colors[3]},
          {x: 135, y: 85, s: 0.5, c: colors[4]},
          {x: 65, y: 65, s: 0.8, c: colors[5]}
        ];
        let paths = '';
        coords.forEach(item => {
          paths += `<path transform="translate(${item.x},${item.y}) scale(${item.s})"
                          d="M100,175 C30,120 15,60 55,30 C85,8 100,45 100,45 C100,45 115,8 145,30 C185,60 170,120 100,175 Z"
                          fill="${item.c}" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>`;
        });
        return `
          <svg viewBox="0 0 240 220" class="w-56 h-56 sm:w-72 sm:h-72 drop-shadow-[0_10px_25px_rgba(255,255,255,0.7)]">
            <g>${paths}</g>
          </svg>
        `;
      }
      return '';
    }

    function renderFallbackSvg(type) {
      if (type === 'snowman') {
        return `
          <svg viewBox="0 0 160 180" class="w-48 h-48 sm:w-60 sm:h-60 drop-shadow-[0_10px_25px_rgba(255,255,255,0.8)]">
            <circle cx="80" cy="125" r="45" fill="#f0f9ff" stroke="#ffffff" stroke-width="4"/>
            <circle cx="80" cy="65" r="32" fill="#ffffff" stroke="#ffffff" stroke-width="4"/>
            <circle cx="70" cy="60" r="4" fill="#ff1493"/>
            <circle cx="90" cy="60" r="4" fill="#ff1493"/>
            <polygon points="80,66 104,71 80,75" fill="#ff7f0e"/>
            <path d="M72,78 Q80,86 88,78" stroke="#ff1493" stroke-width="2.5" fill="none"/>
            <rect x="58" y="88" width="44" height="12" rx="5" fill="#ff007f"/>
            <rect x="85" y="94" width="12" height="30" rx="3" fill="#ff007f"/>
            <rect x="62" y="24" width="36" height="18" fill="#4a5568"/>
            <rect x="50" y="40" width="60" height="6" rx="2" fill="#2d3748"/>
            <circle cx="80" cy="115" r="4" fill="#ff007f"/>
            <circle cx="80" cy="135" r="4" fill="#ff007f"/>
          </svg>
        `;
      }

      if (type === 'elsa_singing') {
        return `
          <div class="relative w-44 h-44 sm:w-56 sm:h-56 flex items-center justify-center bg-gradient-to-tr from-sky-400 via-pink-300 to-amber-200 rounded-full border-4 border-white shadow-[0_10px_30px_rgba(255,255,255,0.7)]">
            <span class="text-6xl sm:text-7xl">👑</span>
            <span class="absolute top-3 right-3 text-3xl">❄️</span>
            <span class="absolute bottom-3 left-3 text-3xl">🎤</span>
            <span class="absolute top-2 left-5 text-2xl">✨</span>
          </div>
        `;
      }
    }

    function renderImage(imgConfig) {
      const stage = document.getElementById('imageStage');

      if (imgConfig.type.startsWith('turtle_')) {
        stage.innerHTML = renderTurtleSvg(imgConfig.type);
        return;
      }

      if (imgConfig.type === 'file_or_fallback') {
        stage.innerHTML = `
          <div class="relative flex items-center justify-center">
            <img src="${imgConfig.src}" alt=""
                 class="max-h-56 sm:max-h-64 max-w-full object-contain rounded-2xl drop-shadow-[0_10px_25px_rgba(0,0,0,0.2)]"
                 onload="this.classList.remove('hidden'); const fb=document.getElementById('fallback_${imgConfig.id}'); if(fb) fb.remove();"
                 onerror="this.remove(); document.getElementById('fallback_${imgConfig.id}').classList.remove('hidden');" />
            <div id="fallback_${imgConfig.id}" class="hidden flex items-center justify-center">
              ${renderFallbackSvg(imgConfig.fallback)}
            </div>
          </div>
        `;
      }
    }

    let bounceAnimFrame = null;
    let bounceX = 20, bounceY = 20;
    let bounceVX = 3.2, bounceVY = 2.8;
    let currentBouncingTarget = null;

    function stopBrickBreaker() {
      if (bounceAnimFrame) {
        cancelAnimationFrame(bounceAnimFrame);
        bounceAnimFrame = null;
      }
      if (currentBouncingTarget) {
        currentBouncingTarget.classList.remove('bouncing-active');
        currentBouncingTarget.style.left = '';
        currentBouncingTarget.style.top = '';
        currentBouncingTarget = null;
      }
      // Au cas où : réinitialiser imageStage et messageStage
      const imgStage = document.getElementById('imageStage');
      const msgStage = document.getElementById('messageStage');
      imgStage.classList.remove('bouncing-active');
      imgStage.style.left = '';
      imgStage.style.top = '';
      msgStage.classList.remove('bouncing-active');
      msgStage.style.left = '';
      msgStage.style.top = '';
    }

    function startBrickBreaker() {
      stopBrickBreaker();

      // Choisir aléatoirement si c'est SEULE l'image OU SEUL le texte qui rebondit
      const bounceImageOnly = Math.random() < 0.5;
      const targetElement = bounceImageOnly 
        ? document.getElementById('imageStage') 
        : document.getElementById('messageStage');

      currentBouncingTarget = targetElement;
      targetElement.classList.add('bouncing-active');

      const maxW = Math.max(window.innerWidth - 250, 10);
      const maxH = Math.max(window.innerHeight - 250, 10);
      bounceX = Math.random() * maxW + 20;
      bounceY = Math.random() * maxH + 20;
      bounceVX = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 1.6 + 2.4);
      bounceVY = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 1.6 + 2.4);

      function step() {
        if (!currentBouncingTarget) return;

        const rect = currentBouncingTarget.getBoundingClientRect();
        const screenW = window.innerWidth;
        const screenH = window.innerHeight;

        bounceX += bounceVX;
        bounceY += bounceVY;

        if (bounceX <= 10) {
          bounceX = 10;
          bounceVX = Math.abs(bounceVX);
        } else if (bounceX + rect.width >= screenW - 10) {
          bounceX = screenW - rect.width - 10;
          bounceVX = -Math.abs(bounceVX);
        }

        if (bounceY <= 10) {
          bounceY = 10;
          bounceVY = Math.abs(bounceVY);
        } else if (bounceY + rect.height >= screenH - 10) {
          bounceY = screenH - rect.height - 10;
          bounceVY = -Math.abs(bounceVY);
        }

        currentBouncingTarget.style.left = bounceX + 'px';
        currentBouncingTarget.style.top = bounceY + 'px';

        bounceAnimFrame = requestAnimationFrame(step);
      }
      bounceAnimFrame = requestAnimationFrame(step);
    }

    let lastM = -1, lastI = -1, lastA = -1;

    function getNextIndex(len, last) {
      if (len <= 1) return 0;
      let next = Math.floor(Math.random() * len);
      while (next === last) {
        next = Math.floor(Math.random() * len);
      }
      return next;
    }

    function setRandomBackground() {
      // 1 fois sur 5 environ (20% de probabilité) -> Jaune clair uni
      const isYellow = Math.random() < 0.20;
      const body = document.getElementById('bodyRoot');
      const textElem = document.getElementById('messageStage');

      if (isYellow) {
        body.style.background = SPECIAL_YELLOW;
        // Rehausser le contraste pour que le texte et les formes restent ultra lisibles sur fond jaune
        textElem.style.color = '#ff007f';
        textElem.style.textShadow = '0 2px 10px rgba(255, 255, 255, 0.9)';
      } else {
        const bg = BACKGROUNDS[Math.floor(Math.random() * BACKGROUNDS.length)];
        body.style.background = bg;
        textElem.style.color = '#ffffff';
        textElem.style.textShadow = '0 4px 12px rgba(219,39,119,0.9)';
      }
    }

    function nextCombo() {
      const mIdx = getNextIndex(MESSAGES.length, lastM);
      const iIdx = getNextIndex(IMAGES.length, lastI);
      const aIdx = getNextIndex(ANIMATIONS.length, lastA);

      lastM = mIdx;
      lastI = iIdx;
      lastA = aIdx;

      setRandomBackground();

      const imgStage = document.getElementById('imageStage');
      const msgStage = document.getElementById('messageStage');

      // Nettoyage des anciennes classes d'animation
      ANIMATIONS.forEach(a => {
        if (a.className) {
          imgStage.classList.remove(a.className);
          msgStage.classList.remove(a.className);
        }
      });
      stopBrickBreaker();

      renderImage(IMAGES[iIdx]);
      msgStage.textContent = MESSAGES[mIdx];

      const anim = ANIMATIONS[aIdx];
      if (anim.type === 'bounce') {
        startBrickBreaker();
      } else if (anim.target === 'image') {
        imgStage.classList.add(anim.className);
      } else if (anim.target === 'text') {
        msgStage.classList.add(anim.className);
      }

      burstHearts();
    }

    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class FloatingItem {
      constructor(burst = false) {
        this.reset(burst);
      }
      reset(burst = false) {
        this.x = burst ? window.innerWidth / 2 + (Math.random() * 160 - 80) : Math.random() * canvas.width;
        this.y = burst ? window.innerHeight / 2 + (Math.random() * 120 - 60) : canvas.height + 20;
        this.size = Math.random() * 14 + 10;
        this.vy = burst ? -(Math.random() * 7 + 4) : -(Math.random() * 1.5 + 0.6);
        this.vx = burst ? (Math.random() * 8 - 4) : (Math.random() * 1.4 - 0.7);
        this.rot = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.04;
        this.opacity = burst ? 1 : Math.random() * 0.55 + 0.35;
        this.decay = burst ? Math.random() * 0.015 + 0.01 : 0;
        this.isStar = Math.random() > 0.65;
        const colors = ['#ffffff', '#ff1493', '#ff69b4', '#ffd700', '#00f5d4', '#fee440'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.y += this.vy;
        this.x += this.vx;
        this.rot += this.vRot;
        if (this.decay > 0) this.opacity -= this.decay;
        if (this.y < -30 || this.opacity <= 0) this.reset(false);
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rot);
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = this.color;

        if (this.isStar) {
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * (this.size * 0.7),
                       -Math.sin((18 + i * 72) * Math.PI / 180) * (this.size * 0.7));
            ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (this.size * 0.35),
                       -Math.sin((54 + i * 72) * Math.PI / 180) * (this.size * 0.35));
          }
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          const top = this.size * 0.3;
          ctx.moveTo(0, top);
          ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, top);
          ctx.bezierCurveTo(-this.size / 2, (this.size + top) / 2, 0, this.size, 0, this.size * 1.25);
          ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + top) / 2, this.size / 2, top);
          ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, top);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    for (let i = 0; i < 35; i++) {
      particles.push(new FloatingItem(false));
    }

    function burstHearts() {
      for (let i = 0; i < 18; i++) {
        particles.push(new FloatingItem(true));
      }
      if (particles.length > 70) particles.splice(0, 18);
    }

    function particleLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(particleLoop);
    }
    particleLoop();

    function recordVisit() {
      // 1. Sauvegarde locale horodatée
      const now = new Date().toISOString();
      let visitHistory = [];
      try {
        visitHistory = JSON.parse(localStorage.getItem('marie_visites') || '[]');
      } catch(e) {}
      visitHistory.push(now);
      localStorage.setItem('marie_visites', JSON.stringify(visitHistory));

      // 2. Compteur en ligne public instantané (sans clé secrète nécessaire)
      // Ce webhook met à jour un compteur incrémental sécurisé pour votre site
      const siteNamespace = "pour-marie-" + window.location.hostname.replace(/[^a-zA-Z0-9]/g, '_');
      fetch(`https://api.counterapi.dev/v1/${siteNamespace}/visits/up`).catch(() => {});
    }

    // Un clic permet de relancer pour tester facilement
    document.getElementById('bodyRoot').addEventListener('click', () => {
      nextCombo();
    });

    window.addEventListener('load', () => {
      nextCombo();
      recordVisit();
